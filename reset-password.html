<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png">
  <title>Imposta nuova password - Grappoli & Luppoli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <style>body{background:linear-gradient(135deg,#092A37 0%,#0a3d4f 100%);}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">Imposta nuova password</h1>
    <div id="info" class="text-sm text-gray-600 mb-4 text-center">Verifica del link in corso…</div>
    <form id="form" class="space-y-4 hidden" onsubmit="setNewPassword(event)">
      <input type="password" id="newpw" placeholder="Nuova password (min 6)" required
             class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl">
      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700">Salva password</button>
    </form>
    <div class="mt-4 text-center"><a href="index.html" class="text-sm text-gray-500 hover:text-gray-700">Torna al login</a></div>
  </div>
  <script>
    // Quando si arriva dal link email, Supabase emette l'evento PASSWORD_RECOVERY
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
        document.getElementById('info').textContent = 'Inserisci la tua nuova password.';
        document.getElementById('form').classList.remove('hidden');
      }
    });
    // Fallback: se c'è già una sessione di recupero
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('info').textContent = 'Inserisci la tua nuova password.';
        document.getElementById('form').classList.remove('hidden');
      } else {
        setTimeout(() => {
          if (document.getElementById('form').classList.contains('hidden')) {
            document.getElementById('info').textContent = 'Link non valido o scaduto. Richiedi un nuovo reset dalla pagina di login.';
          }
        }, 2500);
      }
    })();

    async function setNewPassword(e) {
      e.preventDefault();
      const pw = document.getElementById('newpw').value;
      if (pw.length < 6) { alert('La password deve avere almeno 6 caratteri.'); return; }
      const { error } = await supabaseClient.auth.updateUser({ password: pw });
      if (error) { alert('Errore: ' + error.message); return; }
      alert('Password aggiornata! Ora puoi accedere.');
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
