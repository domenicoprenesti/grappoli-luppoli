<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
    <title>Login - Grappoli & Luppoli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #092A37 0%, #0a3d4f 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full">
        <div class="text-center mb-8">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Grappoli & Luppoli</h1>
            <p class="text-gray-600">Gestione Contabile</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label for="loginEmail" class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                <input type="email" id="loginEmail" autocomplete="email" placeholder="Inserisci la tua email" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="Inserisci la password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" required>
            </div>

            <div id="errorMessage" class="hidden bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span id="errorText">Credenziali errate. Riprova.</span>
                </div>
            </div>

            <button type="submit" id="loginButton" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3 rounded-xl font-semibold hover:from-blue-700 hover:to-indigo-700 transition-all transform hover:scale-[1.02] shadow-lg">
                Accedi
            </button>

            <div class="mt-4 text-center">
                <button type="button" onclick="forgotPassword()" class="text-sm text-blue-600 hover:text-blue-800">Password dimenticata?</button>
            </div>
        </form>
    </div>

    <script>
        // supabaseClient, SUPABASE_URL e SUPABASE_ANON_KEY arrivano da auth.js

        async function checkExistingSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) { window.location.href = 'dashboard.html'; }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const loginButton = document.getElementById('loginButton');
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            loginButton.disabled = true;
            loginButton.textContent = 'Accesso in corso...';

            const showError = (msg) => {
                errorText.textContent = msg;
                errorMessage.classList.remove('hidden');
                setTimeout(() => errorMessage.classList.add('hidden'), 3000);
                loginButton.disabled = false;
                loginButton.textContent = 'Accedi';
            };

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) { passwordInput.value = ''; showError('Email o password errati.'); return; }

                // Controllo "utente attivo"
                const { data: profile } = await supabaseClient
                    .from('utenti').select('attivo').eq('auth_id', data.user.id).single();
                if (profile && profile.attivo === false) {
                    await supabaseClient.auth.signOut();
                    showError('Utente disattivato.');
                    return;
                }
                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error(err);
                showError('Errore di sistema.');
            }
        }

        async function forgotPassword() {
            const email = (document.getElementById('loginEmail').value || prompt('Inserisci la tua email:') || '').trim().toLowerCase();
            if (!email) { alert('Inserisci prima la tua email nel campo Email.'); return; }
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + window.location.pathname.replace(/index\.html$/, '') + 'reset-password.html'
            });
            alert(error ? ('Errore: ' + error.message) : 'Se l\'email è registrata, riceverai un link per reimpostare la password.');
        }

        checkExistingSession();
    </script>
</body>
</html>
