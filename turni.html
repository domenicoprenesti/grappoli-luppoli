    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      .main-content { flex: 1; min-width: 0; overflow-x: auto; }

</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
  <script>(async () => { await requireAuth('turni.html'); initTurni(); })();</script>
  <nav></nav>
  <div class="flex pt-16">
    <aside class="sidebar bg-gradient-to-b from-gray-700 via-gray-800 to-gray-900 text-white flex flex-col">
      <div class="p-3 border-b border-white/10">
        <h1 class="text-lg font-bold flex items-center">🗓️ Gestione turni</h1>
      </div>
      <div id="tabs" class="flex-1 overflow-y-auto p-2"></div>
    </aside>
    <main class="main-content p-6">
      <div id="tabBody"></div>
    </main>
  </div>
  <script>
    const GIORNI = ['','Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
    const esc = s => { const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; };
    const nomePeriodo = p => p.nome + ((p.data_inizio||p.data_fine)? ` (${p.data_inizio||'…'} → ${p.data_fine||'…'})` : '');
    async function loadPeriodi(){ const { data } = await supabaseClient.from('turni_periodi').select('*').order('id'); return data||[]; }
    function renderPeriodi(box){
      renderLista(box, { tabella:'turni_periodi', titolo:'Periodi (stagioni)', ordina:'id', campi:[
        {k:'nome', label:'Nome', tipo:'text', obbligatorio:true},
        {k:'data_inizio', label:'Dal', tipo:'date'},
        {k:'data_fine', label:'Al', tipo:'date'},
        {k:'attivo', label:'Attivo', tipo:'check', def:true},
      ]});
    }
    const SEZIONI = [
      {key:'pianificazione', label:'Pianificazione', render:renderPianificazione},
      {key:'organico', label:'Organico', render:renderOrganico},
      {key:'mansioni', label:'Mansioni', render:renderMansioni},
      {key:'periodi', label:'Periodi', render:renderPeriodi},
      {key:'orari', label:'Apertura & orari', render:renderOrariFasi},
      {key:'esigenze', label:'Esigenze del periodo', render:renderEsigenze},
      {key:'accordi', label:'Accordi personali', render:renderAccordi},
      {key:'regole', label:'Regole', render:renderRegole},
      {key:'assenze', label:'Assenze', render:renderAssenze},
      {key:'chiusure', label:'Chiusure', render:renderChiusure},
      {key:'assistente', label:'Assistente', render:renderAssistente},
    ];
    const AREE = [
      {key:'pianificazione', label:'Pianificazione', sezioni:['pianificazione']},
      {key:'organico', label:'Organico', sezioni:['organico','accordi','mansioni','assenze']},
      {key:'fabbisogno', label:'Fabbisogno', sezioni:['periodi','orari','esigenze','chiusure']},
      {key:'regole', label:'Regole', sezioni:['regole']},
      {key:'assistente', label:'Assistente', sezioni:['assistente']},
    ];
    let areaAttiva = 'pianificazione';
    let tabAttiva = 'pianificazione';
    function initTurni(){ apriArea('pianificazione'); }
    function apriArea(ak){ areaAttiva=ak; const a=AREE.find(x=>x.key===ak); apriTab(a.sezioni[0]); }
    function renderTabs(){
      const bar=document.getElementById('tabs'); bar.innerHTML='';
      AREE.forEach(a=>{
        const active = areaAttiva===a.key;
        const ab=document.createElement('button'); ab.textContent=a.label;
        ab.className='w-full text-left px-3 py-2 rounded font-semibold text-sm mb-0.5 '+(active?'bg-white/20 text-white':'text-gray-200 hover:bg-white/10');
        ab.onclick=()=>apriArea(a.key); bar.appendChild(ab);
        if(active && a.sezioni.length>1){
          a.sezioni.forEach(sk=>{ const s=SEZIONI.find(x=>x.key===sk); if(!s) return;
            const sb=document.createElement('button'); sb.textContent=s.label;
            sb.className='w-full text-left pl-6 pr-3 py-1.5 rounded text-sm mb-0.5 '+(tabAttiva===sk?'bg-white/25 text-white font-medium':'text-gray-300 hover:bg-white/10');
            sb.onclick=()=>apriTab(sk); bar.appendChild(sb); });
        }
      });
    }
    function apriTab(key){ tabAttiva=key; renderTabs(); const s=SEZIONI.find(x=>x.key===key); document.getElementById('tabBody').innerHTML=''; s.render(document.getElementById('tabBody')); }

    // ---------- PIANIFICAZIONE (editor settimanale) ----------
    let settLun = null; // lunedì della settimana visualizzata (Date)
    function lunediDi(d){ const x=new Date(d); const g=(x.getDay()+6)%7; x.setDate(x.getDate()-g); x.setHours(0,0,0,0); return x; }
    function isoData(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function itGG(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
    function giornoIdx(d){ return ((d.getDay()+6)%7)+1; }

    let vistaCopertura = 'dettaglio';
    let vistaMese = false;
    let meseCur = null;
    const tStr = t => (t||'').slice(0,5);
    const isoGG = iso => iso.slice(8,10)+'/'+iso.slice(5,7);
    function overlapT(aI,aF,bI,bF){ const m=t=>{const a=(t||'0:0').split(':'); return (+a[0])*60+(+a[1]);}; let ai=m(aI),af=m(aF); if(af<=ai)af+=1440; let bi=m(bI),bf=m(bF); if(bf<=bi)bf+=1440; return ai<bf && af>bi; }
    function rangeLen(p){ return (new Date(p.data_fine) - new Date(p.data_inizio)); }
    function risolviPeriodo(iso, periodi){
      const dated = periodi.filter(p=>p.data_inizio && p.data_fine && p.data_inizio<=iso && iso<=p.data_fine);
      if(dated.length){ dated.sort((a,b)=>rangeLen(a)-rangeLen(b)); return dated[0]; }
      return periodi.find(p=>!p.data_inizio && !p.data_fine) || null;
    }
    function calcolaCopertura(giorni, ass, periodi, esigenze, mNome, orari){
      const byDate={}; (ass||[]).forEach(a=>{ (byDate[a.data]=byDate[a.data]||[]).push(a); });
      return giorni.map(d=>{
        const iso=isoData(d); const gi=giornoIdx(d);
        if(statoGiorno(iso).chiuso) return { iso, gi, periodoNome:null, fasce:[], haGap:false, chiuso:true };
        const per=risolviPeriodo(iso, periodi);
        if(!per) return { iso, gi, periodoNome:null, fasce:[], haGap:false };
        const or=(orari||[]).find(o=>o.periodo_id===per.id && o.giorno===gi) || (orari||[]).find(o=>o.giorno===gi);
        const A=(or&&or.apertura)||null, C=(or&&or.chiusura)||null;
        const assg=byDate[iso]||[];
        const fout=esigenzeGiorno(esigenze, per.id, gi).filter(e=>e.tipo==='copertura').map(e=>{
          const w=risolviFinestra(e,A,C); if(!w) return null;
          const cnt=assg.filter(a=> overlapT(a.ora_inizio,a.ora_fine,w.inizio,w.fine) && (!e.mansione_id || a.mansione_id===e.mansione_id)).length;
          return { inizio:w.inizio, fine:w.fine, mansioneNome: e.mansione_id?(mNome[e.mansione_id]||''):null, richiesto:e.min_risorse, assegnati:cnt, scoperto: cnt<e.min_risorse };
        }).filter(Boolean).sort((a,b)=>a.inizio.localeCompare(b.inizio));
        return { iso, gi, periodoNome: per.nome, fasce: fout, haGap: fout.some(x=>x.scoperto) };
      });
    }
    function vistaDettaglioCop(box, cop){
      const wrap=document.createElement('div'); wrap.className='mt-4';
      wrap.innerHTML='<h3 class="font-semibold text-sm mb-2">Copertura</h3>';
      const grid=document.createElement('div'); grid.className='grid gap-2 md:grid-cols-2 lg:grid-cols-4';
      cop.forEach(g=>{
        const card=document.createElement('div'); card.className='bg-white rounded shadow p-2 text-xs';
        let h=`<div class="font-medium">${GIORNI[g.gi]} ${isoGG(g.iso)}${g.periodoNome?(' · '+esc(g.periodoNome)):''}</div>`;
        if(!g.fasce.length) h+='<div class="text-gray-400">nessun minimo definito</div>';
        else h+=g.fasce.map(f=>`<div class="${f.scoperto?'text-red-600':'text-emerald-700'}">${tStr(f.inizio)}–${tStr(f.fine)}${f.mansioneNome?(' · '+esc(f.mansioneNome)):''}: ${f.assegnati}/${f.richiesto}${f.scoperto?' ⚠':''}</div>`).join('');
        card.innerHTML=h; grid.appendChild(card);
      });
      wrap.appendChild(grid); box.appendChild(wrap);
    }
    function popupCoperturaGiorno(g){
      const ov=document.createElement('div'); ov.className='fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4'; ov.onclick=()=>ov.remove();
      const card=document.createElement('div'); card.className='bg-white rounded-lg p-4 max-w-sm w-full shadow-xl text-sm'; card.onclick=e=>e.stopPropagation();
      let h=`<h3 class="font-bold mb-2">Copertura ${GIORNI[g.gi]} ${isoGG(g.iso)}</h3>`;
      if(!g.fasce.length) h+='<div class="text-gray-400">Nessun minimo definito.</div>';
      else h+=g.fasce.map(f=>`<div class="${f.scoperto?'text-red-600':'text-emerald-700'}">${tStr(f.inizio)}–${tStr(f.fine)}${f.mansioneNome?(' · '+esc(f.mansioneNome)):''}: ${f.assegnati}/${f.richiesto}${f.scoperto?' ⚠':''}</div>`).join('');
      h+='<div class="text-right mt-3"><button id="c" class="px-3 py-1.5 bg-gray-100 rounded">Chiudi</button></div>';
      card.innerHTML=h; card.querySelector('#c').onclick=()=>ov.remove();
      ov.appendChild(card); document.body.appendChild(ov);
    }
    function durOre(i,f){ const p=s=>{ const a=(s||'0:0').split(':'); return (+a[0])*60+(+a[1]); }; let d=p(f)-p(i); if(d<=0) d+=1440; return d/60; }
    function shiftMin(t, delta){ const a=(t||'0:0').split(':'); let m=(+a[0])*60+(+a[1])+delta; m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':00'; }
    function esigenzeGiorno(esigenze, periodoId, gi){ return (esigenze||[]).filter(e=>e.attivo!==false && e.periodo_id===periodoId && (e.giorno==null || e.giorno===gi)); }
    function risolviFinestra(e, A, C){
      if(e.ancora==='assoluto'){ return (e.ora_inizio&&e.ora_fine)? {inizio:e.ora_inizio, fine:e.ora_fine} : null; }
      if(e.ancora==='apertura'){ return A? {inizio:shiftMin(A, e.off_inizio_min||0), fine:shiftMin(A, e.off_fine_min||0)} : null; }
      if(e.ancora==='chiusura'){ return C? {inizio:shiftMin(C, e.off_inizio_min||0), fine:shiftMin(C, e.off_fine_min||0)} : null; }
      return null;
    }
    function isoWeekNum(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3); const firstThu=new Date(Date.UTC(t.getUTCFullYear(),0,4)); const fday=(firstThu.getUTCDay()+6)%7; firstThu.setUTCDate(firstThu.getUTCDate()-fday+3); return 1+Math.round((t-firstThu)/(7*24*3600*1000)); }
    function giorniConsecutivi(set, iso){ const a=iso.split('-').map(Number); let d=new Date(a[0],a[1]-1,a[2]); let n=1; for(;;){ d.setDate(d.getDate()-1); const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(set.has(s)) n++; else break; } return n; }

    // costo di sbilancio ore per il riequilibrio: sotto contratto pesa sempre; sopra contratto
    // pesa solo per chi NON è "massimizza ore" (per i max_ore lo straordinario è "gratis" → attira l'eccedenza);
    // per gli "a chiamata" ogni ora è indesiderata (ultima risorsa) → si cerca di scaricarle sui regolari.
    function costoRis(r, ore){
      if(r.tipo_contratto==='a_chiamata') return ore*2;
      const c=Number(r.ore_contratto||0);
      if(r.categoria==='socio'){ const norm=(r.ore_normali!=null?Number(r.ore_normali):c); return Math.min(ore,norm)*0.6 + Math.max(0,ore-norm)*1.5; }
      const d=ore-c;
      if(d<0) return (-d)*1.0;
      return r.max_ore ? 0 : d*1.2;
    }
    function prioritaRis(r, ore){
      const c=Number(r.ore_contratto||0);
      if(r.categoria==='socio'){ const norm=(r.ore_normali!=null?Number(r.ore_normali):c); return ore<norm ? [1, ore-norm] : [2, ore-norm]; }
      if(r.tipo_contratto==='a_chiamata') return [3, ore];
      if(ore<c) return [0, ore-c];
      return r.max_ore ? [2, ore-c] : [2.5, ore-c];
    }
    function scegliRisorsa(risorse, st, ctx){
      const {iso, gi, settN, fascia, chiude, mansByR, accByRG, rotPhase, assenze, riposoMin, maxCons, usaChiamata} = ctx;
      const dur = durOre(fascia.inizio, chiude);
      const maxWork = 7 - riposoMin;
      // ignoraRot=true = ultima risorsa "copri sempre": salta SOLO la rotazione (1su2/2su3/3su4),
      // ma resta rigido su riposo minimo, assenze, mansioni, doppio turno e tetti ore. 'mai' resta invalicabile.
      const eligibili = (pool, ignoraRot) => pool.filter(r=>{
        if(st[r.id].giorni.has(iso)) return false;
        if(assenze.some(x=>x.risorsa_id===r.id && iso>=x.data_inizio && iso<=x.data_fine)) return false;
        if(fascia.mansione_id && !(mansByR[r.id]&&mansByR[r.id].has(fascia.mansione_id))) return false;
        const acc=accByRG[r.id+'|'+gi]; const cad=acc?acc.cadenza:'sempre';
        if(cad==='mai') return false;
        if(!ignoraRot){
          const ph=rotPhase?(rotPhase[r.id+'|'+gi]||0):0;
          if(cad==='1su2' && (settN+ph)%2!==0) return false;
          if(cad==='2su3' && (settN+ph)%3===0) return false;
          if(cad==='3su4' && (settN+ph)%4===0) return false;
        }
        if(st[r.id].giorni.size >= maxWork) return false;
        if(maxCons && giorniConsecutivi(st[r.id].giorni, iso) > maxCons) return false;
        const limite = r.tipo_contratto==='a_chiamata'
          ? (r.str_max_sett!=null? Number(r.str_max_sett) : Infinity)
          : (Number(r.ore_contratto||0) + (r.str_max_sett!=null? Number(r.str_max_sett) : Infinity));
        if(st[r.id].ore + dur > limite) return false;
        return true;
      });
      const regolari=risorse.filter(r=>r.tipo_contratto!=='a_chiamata');
      const aChiamata=risorse.filter(r=>r.tipo_contratto==='a_chiamata');
      let forced=false;
      let pool = eligibili(regolari, false);
      if(!pool.length && usaChiamata) pool = eligibili(aChiamata, false);
      if(!pool.length){ pool = eligibili(regolari, true); if(pool.length) forced=true; }
      if(!pool.length && usaChiamata){ pool = eligibili(aChiamata, true); if(pool.length) forced=true; }
      if(!pool.length) return null;
      pool.sort((a,b)=>{
        const pa=prioritaRis(a, st[a.id].ore), pb=prioritaRis(b, st[b.id].ore);
        if(pa[0]!==pb[0]) return pa[0]-pb[0];
        if(pa[1]!==pb[1]) return pa[1]-pb[1];
        const ra=(accByRG[a.id+'|'+gi]&&accByRG[a.id+'|'+gi].pref_riposo)?1:0, rb=(accByRG[b.id+'|'+gi]&&accByRG[b.id+'|'+gi].pref_riposo)?1:0;
        if(ra!==rb) return ra-rb;
        if(st[a.id].giorni.size!==st[b.id].giorni.size) return st[a.id].giorni.size-st[b.id].giorni.size;
        return a.id-b.id;
      });
      return {cand: pool[0], forced};
    }

    function settRangeDefault(){ const lun=lunediDi(settLun||new Date()); const dom=new Date(lun); dom.setDate(dom.getDate()+6); return {dal:isoData(lun), al:isoData(dom)}; }
    function dateInIntervallo(dal, al){ const p=s=>{const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]);}; const out=[]; let d=p(dal); const end=p(al); while(d<=end){ out.push(new Date(d)); d.setDate(d.getDate()+1); } return out; }
    function chiediPeriodo(titolo, def, onOk, mostraChiamata){
      const ov=document.createElement('div'); ov.className='fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4'; ov.onclick=()=>ov.remove();
      const card=document.createElement('div'); card.className='bg-white rounded-lg p-5 max-w-sm w-full shadow-xl text-sm'; card.onclick=e=>e.stopPropagation();
      card.innerHTML=`<h3 class="text-lg font-bold mb-3">${esc(titolo)}</h3>
        <div class="flex gap-2"><label class="flex-1">Dal<input id="pd" type="date" class="w-full border rounded px-2 py-1" value="${def.dal}"></label>
          <label class="flex-1">Al<input id="pa" type="date" class="w-full border rounded px-2 py-1" value="${def.al}"></label></div>
        ${mostraChiamata?'<label class="flex items-center gap-2 mt-3"><input id="uc" type="checkbox"> Usa anche le risorse <b>a chiamata</b> (altrimenti restano una eccezione da coprire a mano)</label>':''}
        <div class="text-right mt-4"><button id="ann" class="px-3 py-1.5 bg-gray-100 rounded mr-2">Annulla</button><button id="ok" class="px-3 py-1.5 bg-blue-600 text-white rounded">Conferma</button></div>`;
      card.querySelector('#ann').onclick=()=>ov.remove();
      card.querySelector('#ok').onclick=()=>{ const dal=card.querySelector('#pd').value, al=card.querySelector('#pa').value; if(!dal||!al||al<dal){ alert('Intervallo non valido.'); return; } const uc=card.querySelector('#uc'); ov.remove(); onOk(dal,al, uc?uc.checked:false); };
      ov.appendChild(card); document.body.appendChild(ov);
    }

    async function generaBozza(box){ chiediPeriodo('Genera bozza — scegli il periodo', settRangeDefault(), (dal,al,usaChiamata)=>{ if(confirm('Genera la bozza da '+dal+' a '+al+'? I turni inseriti a mano restano; la bozza precedente in questo intervallo viene rifatta.')) eseguiGenera(box,dal,al,usaChiamata); }, true); }

    async function eseguiGenera(box, dal, al, usaChiamata){
      const p=s=>{const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]);};
      const loadDal=isoData(lunediDi(p(dal)));
      const lunUlt=lunediDi(p(al)); const domUlt=new Date(lunUlt); domUlt.setDate(domUlt.getDate()+6); const loadAl=isoData(domUlt);
      await supabaseClient.from('turni_assegnazioni').delete().eq('generato',true).gte('data',dal).lte('data',al);
      const [rq, mq, aq, asq, pq, oq, cq, exq, gq, mnq] = await Promise.all([
        supabaseClient.from('turni_risorse').select('id,nome,cognome,ore_contratto,tipo_contratto,str_max_sett,giorni_riposo,max_ore,categoria,ore_normali').eq('attivo',true),
        supabaseClient.from('turni_risorse_mansioni').select('risorsa_id,mansione_id'),
        supabaseClient.from('turni_accordi').select('*'),
        supabaseClient.from('turni_assenze').select('risorsa_id,data_inizio,data_fine'),
        supabaseClient.from('turni_periodi').select('*'),
        supabaseClient.from('turni_orari').select('*'),
        supabaseClient.from('turni_esigenze').select('*'),
        supabaseClient.from('turni_assegnazioni').select('*').gte('data',loadDal).lte('data',loadAl),
        supabaseClient.from('turni_regole').select('*').eq('id',1).maybeSingle(),
        supabaseClient.from('turni_mansioni').select('id,nome'),
      ]);
      const esigenze=cq.data||[];
      const risorse=rq.data||[];
      const mansByR={}; (mq.data||[]).forEach(m=>{ (mansByR[m.risorsa_id]=mansByR[m.risorsa_id]||new Set()).add(m.mansione_id); });
      const accByRG={}; (aq.data||[]).forEach(a=>{ accByRG[a.risorsa_id+'|'+a.giorno]=a; });
      // sfasamento rotazioni: risorse con stessa (giorno,cadenza) riposano in settimane diverse
      const rotPhase={}; { const groups={}; (aq.data||[]).forEach(a=>{ (groups[a.giorno+'|'+a.cadenza]=groups[a.giorno+'|'+a.cadenza]||[]).push(a); }); Object.values(groups).forEach(list=>{ list.sort((x,y)=>x.risorsa_id-y.risorsa_id).forEach((a,idx)=>{ rotPhase[a.risorsa_id+'|'+a.giorno]=idx; }); }); }
      const assenze=asq.data||[]; const periodi=pq.data||[]; const orari=oq.data||[];
      const reg=gq.data||{}; const riposoMin=Number(reg.riposo_sett_min||0); const maxCons=reg.max_giorni_consecutivi||null; const gp=reg.giorno_prioritario||null;
      const mNome={}; (mnq.data||[]).forEach(m=>mNome[m.id]=m.nome);
      const esist=exq.data||[];
      await caricaChiusure();
      const giorniTot=dateInIntervallo(dal,al);
      const weeks={}; giorniTot.forEach(d=>{ const l=isoData(lunediDi(d)); (weeks[l]=weeks[l]||[]).push(d); });
      const nuovi=[]; const report=[]; const forzati=[]; let oreDaCoprire=0;
      Object.keys(weeks).sort().forEach(lunIso=>{
        const l=p(lunIso); const settN=isoWeekNum(l);
        const st={}; risorse.forEach(r=>st[r.id]={ore:0, giorni:new Set()});
        const weekIsos=[]; for(let i=0;i<7;i++){ const dd=new Date(l); dd.setDate(dd.getDate()+i); weekIsos.push(isoData(dd)); }
        const assByDay={};

    // ---------- Helper CRUD generico (tabelle a lista semplice) ----------
    async function renderLista(box, cfg){
      if(cfg.collapse){
        box.innerHTML = `<details class="bg-white rounded shadow" ${cfg._open?'open':''}>
          <summary class="flex justify-between items-center cursor-pointer p-3 select-none">
            <span class="font-semibold">${esc(cfg.titolo)}</span>
            <button id="add" class="px-3 py-1 bg-blue-600 text-white rounded text-sm">➕ Nuovo</button>
          </summary><div id="lista" class="p-3 pt-0"></div></details>`;
        box.querySelector('details').addEventListener('toggle', e=>{ cfg._open = e.target.open; });
      } else {
        box.innerHTML = `<div class="flex justify-between items-center mb-2"><h2 class="text-lg font-bold">${esc(cfg.titolo)}</h2>
          <button id="add" class="px-3 py-1.5 bg-blue-600 text-white rounded text-sm">➕ Nuovo</button></div><div id="lista"></div>`;
      }
      const ridis=()=>{ renderLista(box,cfg); if(cfg.onChange) cfg.onChange(); };
      box.querySelector('#add').onclick = (e)=>{ if(e){ e.preventDefault(); e.stopPropagation(); } formRecord(cfg, null, ridis); };
      let q = supabaseClient.from(cfg.tabella).select('*');
      if (cfg.filtro) q = q.eq(cfg.filtro.col, cfg.filtro.val);
      if (cfg.ordina) q = q.order(cfg.ordina);
      const { data, error } = await q;
      const lista = box.querySelector('#lista');
      if(error){ lista.innerHTML='<p class="text-red-600 text-sm">'+esc(error.message)+'</p>'; return; }
      const rows = data||[];
      if(!rows.length){ lista.innerHTML='<p class="text-gray-400 text-sm">Nessun record.</p>'; return; }
      const tbl=document.createElement('table'); tbl.className='w-full text-sm bg-white rounded shadow';
      tbl.innerHTML='<thead><tr class="text-left border-b text-gray-500">'+cfg.campi.map(c=>`<th class="p-2">${esc(c.label)}</th>`).join('')+'<th></th></tr></thead>';
      const tb=document.createElement('tbody');
      rows.forEach(r=>{
        const tr=document.createElement('tr'); tr.className='border-b hover:bg-blue-50';
        tr.innerHTML=cfg.campi.map(c=>`<td class="p-2">${esc(fmtCampo(r[c.k],c))}</td>`).join('');
        const td=document.createElement('td'); td.className='p-2 text-right whitespace-nowrap';
        const be=document.createElement('button'); be.textContent='✏️'; be.onclick=()=>formRecord(cfg, r, ridis);
        const bx=document.createElement('button'); bx.textContent='🗑️'; bx.className='ml-2'; bx.onclick=()=>elimRecord(cfg, r.id, ridis);
        td.append(be,bx); tr.appendChild(td); tb.appendChild(tr);
      });
      tbl.appendChild(tb); lista.appendChild(tbl);
    }
    function fmtCampo(v,c){ if(c.tipo==='check') return v?'sì':'no'; if(c.tipo==='select'&&c.opts){ const o=c.opts.find(o=>o.v===v); return o?o.l:(v==null?'':v); } return v==null?'':v; }
    function formRecord(cfg, rec, done){
      const isEdit=!!rec;
      const ov=document.createElement('div'); ov.className='fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4'; ov.onclick=()=>ov.remove();
      const card=document.createElement('div'); card.className='bg-white rounded-lg p-5 max-w-md w-full shadow-xl max-h-[90vh] overflow-y-auto'; card.onclick=e=>e.stopPropagation();
      card.innerHTML=`<h3 class="text-lg font-bold mb-3">${isEdit?'Modifica':'Nuovo'} — ${esc(cfg.titolo)}</h3><div id="f" class="space-y-2 text-sm"></div>
        <div class="text-right mt-4"><button id="ann" class="px-3 py-1.5 bg-gray-100 rounded text-sm mr-2">Annulla</button><button id="sav" class="px-3 py-1.5 bg-blue-600 text-white rounded text-sm">Salva</button></div>`;
      const f=card.querySelector('#f'); const inputs={};
      cfg.campi.forEach(c=>{
        const wrap=document.createElement('label'); wrap.className='block'; wrap.textContent=c.label+' ';
        let el;
        if(c.tipo==='check'){ el=document.createElement('input'); el.type='checkbox'; el.checked = rec ? !!rec[c.k] : (c.def!==undefined? c.def : false); }
        else if(c.tipo==='select'){ el=document.createElement('select'); el.className='w-full border rounded px-2 py-1';
          (c.opts||[]).forEach(o=>{ const op=document.createElement('option'); op.value=o.v==null?'':o.v; op.textContent=o.l; if(rec&&rec[c.k]===o.v) op.selected=true; el.appendChild(op); }); }
        else { el=document.createElement('input'); el.type=(c.tipo==='number'?'number':(c.tipo==='date'?'date':(c.tipo==='time'?'time':'text'))); if(c.step) el.step=c.step; el.className='w-full border rounded px-2 py-1'; if(rec&&rec[c.k]!=null) el.value=rec[c.k]; }
        inputs[c.k]=el; wrap.appendChild(el); f.appendChild(wrap);
      });
      card.querySelector('#ann').onclick=()=>ov.remove();
      card.querySelector('#sav').onclick=async()=>{
        const payload={};
        for(const c of cfg.campi){
          const el=inputs[c.k];
          let v = c.tipo==='check'? el.checked : (c.tipo==='number'? (el.value===''?null:Number(el.value)) : el.value);
          if(c.tipo==='select'){ if(el.value===''){ v=null; } else { const o=(c.opts||[]).find(o=>String(o.v)===el.value); v = o? o.v : el.value; } }
          if((c.tipo==='date'||c.tipo==='time') && v==='') v=null;
          if(c.obbligatorio && (v===''||v==null)){ alert('Campo obbligatorio: '+c.label); return; }
          payload[c.k]=v;
        }
        if(cfg.fissi) Object.assign(payload, cfg.fissi);
        let res;
        if(isEdit) res=await supabaseClient.from(cfg.tabella).update(payload).eq('id', rec.id);
        else res=await supabaseClient.from(cfg.tabella).insert(payload);
        if(res.error){ alert(res.error.message); return; }
        ov.remove(); done();
      };
      ov.appendChild(card); document.body.appendChild(ov);
    }

      if(!confirm('Eliminare il record?')) return;
      const { error } = await supabaseClient.from(cfg.tabella).delete().eq('id', id);
      if(error){ alert(error.message); return; } done();
    }

    // ---------- Organico (risorse + mansioni M:N) ----------
    async function riordinaRisorse(rows, fromId, toId, done){
      if(fromId===toId) return;
      const arr=rows.slice();
      const fi=arr.findIndex(x=>x.id===fromId), ti=arr.findIndex(x=>x.id===toId);
      if(fi<0||ti<0) return;
      const [moved]=arr.splice(fi,1);
      arr.splice(ti,0,moved);
      const res=await Promise.all(arr.map((r,idx)=>supabaseClient.from('turni_risorse').update({ordine:idx+1}).eq('id',r.id)));
      const err=res.find(x=>x.error);
      if(err){ alert(err.error.message); return; }
      done();
    }
    async function scambiaOrdineRisorse(a, b, done){
      if(!a || !b) return;
      const oa=a.ordine, ob=b.ordine;
      const e1=(await supabaseClient.from('turni_risorse').update({ordine:ob}).eq('id',a.id)).error;
      const e2=(await supabaseClient.from('turni_risorse').update({ordine:oa}).eq('id',b.id)).error;
      if(e1||e2){ alert((e1||e2).message); return; }
      done();
    }

      const [{data:risorse,error}, {data:mans}] = await Promise.all([
        supabaseClient.from('turni_risorse').select('*').order('ordine',{nullsFirst:false}).order('cognome',{nullsFirst:true}).order('nome'),

      const lista=box.querySelector('#lista');
      if(error){ lista.innerHTML='<p class="text-red-600 text-sm">'+esc(error.message)+'</p>'; return; }
      const { data:legami } = await supabaseClient.from('turni_risorse_mansioni').select('risorsa_id,mansione_id');
      const mByR={}; (legami||[]).forEach(l=>{ (mByR[l.risorsa_id]=mByR[l.risorsa_id]||[]).push(l.mansione_id); });
      const mNome={}; (mans||[]).forEach(m=>mNome[m.id]=m.nome);
      const rows=risorse||[];
      if(!rows.length){ lista.innerHTML='<p class="text-gray-400 text-sm">Nessuna risorsa.</p>'; return; }
      const tbl=document.createElement('table'); tbl.className='w-full text-sm bg-white rounded shadow';
      tbl.innerHTML='<thead><tr class="text-left border-b text-gray-500"><th class="p-2">Nome</th><th class="p-2">Ore/sett</th><th class="p-2">Contratto</th><th class="p-2">Riposi</th><th class="p-2">Str. S/M/A</th><th class="p-2">Mansioni</th><th></th></tr></thead>';
      const tb=document.createElement('tbody');
      rows.forEach((r,i)=>{
        const tr=document.createElement('tr'); tr.className='border-b hover:bg-blue-50 cursor-move';
        tr.draggable=true;
        tr.ondragstart=e=>{ e.dataTransfer.setData('text/plain', String(r.id)); e.dataTransfer.effectAllowed='move'; };
        tr.ondragover=e=>{ e.preventDefault(); tr.classList.add('bg-yellow-50'); };
        tr.ondragleave=()=>tr.classList.remove('bg-yellow-50');

        const mList = (mByR[r.id]||[]).map(id=>mNome[id]).filter(Boolean).join(', ');
        tr.innerHTML=`<td class="p-2">${esc((r.cognome||'')+' '+r.nome)}${r.max_ore?' <span title="Massimizza ore">⬆️</span>':''}</td><td class="p-2">${r.ore_contratto}</td><td class="p-2">${esc(contr)}</td><td class="p-2">${r.giorni_riposo}</td><td class="p-2">${esc(str)}</td><td class="p-2 text-gray-600">${esc(mList||'—')}</td>`;
        const td=document.createElement('td'); td.className='p-2 text-right whitespace-nowrap';
        const su=document.createElement('button'); su.textContent='↑'; su.title='Sposta su'; su.className='px-1'; su.disabled=(i===0); if(i===0) su.classList.add('opacity-30'); su.onclick=()=>scambiaOrdineRisorse(r, rows[i-1], ()=>renderOrganico(box));
        const giu=document.createElement('button'); giu.textContent='↓'; giu.title='Sposta giù'; giu.className='px-1'; giu.disabled=(i===rows.length-1); if(i===rows.length-1) giu.classList.add('opacity-30'); giu.onclick=()=>scambiaOrdineRisorse(r, rows[i+1], ()=>renderOrganico(box));
        const be=document.createElement('button'); be.textContent='✏️'; be.className='ml-2'; be.onclick=()=>formRisorsa(r, ()=>renderOrganico(box));
        const bx=document.createElement('button'); bx.textContent='🗑️'; bx.className='ml-2'; bx.onclick=async()=>{ if(!confirm('Eliminare la risorsa?'))return; const {error}=await supabaseClient.from('turni_risorse').delete().eq('id',r.id); if(error)return alert(error.message); renderOrganico(box); };
        td.append(su,giu,be,bx); tr.appendChild(td); tb.appendChild(tr);

    async function renderOrariGrid(oBox, periodoId){
      const { data:esistenti } = await supabaseClient.from('turni_orari').select('giorno').eq('periodo_id',periodoId);
      const have=new Set((esistenti||[]).map(r=>r.giorno));
      const missing=[]; for(let g=1;g<=7;g++) if(!have.has(g)) missing.push({periodo_id:periodoId, giorno:g, aperto:true, apertura:'18:00', chiusura:'23:59'});
      if(missing.length){ const {error}=await supabaseClient.from('turni_orari').insert(missing); if(error){ oBox.innerHTML='<p class="text-red-600 text-sm">'+esc(error.message)+'</p>'; return; } }
      const { data:orari } = await supabaseClient.from('turni_orari').select('*').eq('periodo_id',periodoId).order('giorno');
      const tbl=document.createElement('table'); tbl.className='w-full text-sm bg-white rounded shadow max-w-xl';
      tbl.innerHTML='<thead><tr class="text-left border-b text-gray-500"><th class="p-2">Giorno</th><th class="p-2">Aperto</th><th class="p-2">Apertura</th><th class="p-2">Chiusura</th></tr></thead>';
      const tb=document.createElement('tbody');
      (orari||[]).forEach(o=>{
        const tr=document.createElement('tr'); tr.className='border-b';
        const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=o.aperto;
        const ap=document.createElement('input'); ap.type='time'; ap.value=o.apertura||''; ap.className='border rounded px-1';
        const ch=document.createElement('input'); ch.type='time'; ch.value=o.chiusura||''; ch.className='border rounded px-1';
        const salva=async()=>{ const {error}=await supabaseClient.from('turni_orari').update({aperto:cb.checked, apertura:ap.value||null, chiusura:ch.value||null}).eq('periodo_id',periodoId).eq('giorno',o.giorno); if(error)alert(error.message); };
        cb.onchange=salva; ap.onchange=salva; ch.onchange=salva;
        const td0=document.createElement('td'); td0.className='p-2 font-medium'; td0.textContent=GIORNI[o.giorno];
        const td1=document.createElement('td'); td1.className='p-2'; td1.appendChild(cb);
        const td2=document.createElement('td'); td2.className='p-2'; td2.appendChild(ap);
        const td3=document.createElement('td'); td3.className='p-2'; td3.appendChild(ch);
        tr.append(td0,td1,td2,td3); tb.appendChild(tr);
      });
      tbl.appendChild(tb); oBox.innerHTML=''; oBox.appendChild(tbl);
    }

    // ---------- Esigenze del periodo ----------
    async function renderEsigenze(box){
      const periodi=await loadPeriodi();
      const mans=(await supabaseClient.from('turni_mansioni').select('id,nome').order('nome')).data||[];
      box.innerHTML='<div class="flex items-center gap-3 flex-wrap mb-2"><h2 class="text-lg font-bold">Esigenze del periodo</h2>'+
        '<label class="text-sm">Periodo <select id="per" class="border rounded px-2 py-1 text-sm"></select></label></div>'+
        '<p class="text-xs text-gray-500 mb-2">Copertura = quante persone servono presenti nella finestra (conta per lo scoperto). Estensione = allunga il turno di chi apre/chiude. Finestra: Assoluta (orari) oppure relativa ad Apertura/Chiusura con offset in minuti (es. −60 = un\'ora prima).</p>'+
        '<div id="es"></div>';
      const sel=box.querySelector('#per'); sel.innerHTML=periodi.map(p=>`<option value="${p.id}">${esc(nomePeriodo(p))}</option>`).join('');
      const draw=()=>{ const pid=Number(sel.value); renderLista(box.querySelector('#es'), { tabella:'turni_esigenze', titolo:'Esigenze', ordina:'giorno', filtro:{col:'periodo_id',val:pid}, fissi:{periodo_id:pid}, campi:[
        {k:'tipo', label:'Tipo', tipo:'select', obbligatorio:true, opts:[{v:'copertura',l:'Copertura'},{v:'estensione',l:'Estensione'}]},
        {k:'giorno', label:'Giorno', tipo:'select', opts:[{v:null,l:'Tutti i giorni'}].concat([1,2,3,4,5,6,7].map(g=>({v:g,l:GIORNI[g]})))},
        {k:'ancora', label:'Finestra', tipo:'select', obbligatorio:true, opts:[{v:'assoluto',l:'Assoluta (orari)'},{v:'apertura',l:'Relativa apertura'},{v:'chiusura',l:'Relativa chiusura'}]},
        {k:'ora_inizio', label:'Dalle (se assoluta)', tipo:'time'},
        {k:'ora_fine', label:'Alle (se assoluta)', tipo:'time'},
        {k:'off_inizio_min', label:'Offset inizio (min, se relativa)', tipo:'number'},
        {k:'off_fine_min', label:'Offset fine (min, se relativa)', tipo:'number'},
        {k:'min_risorse', label:'Min risorse', tipo:'number', obbligatorio:true},
        {k:'mansione_id', label:'Mansione', tipo:'select', opts:[{v:null,l:'Chiunque'}].concat(mans.map(m=>({v:m.id,l:m.nome})))},
        {k:'attivo', label:'Attivo', tipo:'check', def:true},
      ]}); };
      sel.onchange=draw;
      if(periodi.length) draw(); else box.querySelector('#es').innerHTML='<p class="text-gray-400 text-sm">Crea prima un periodo (scheda Periodi).</p>';
    }

    // ---------- Accordi personali ----------
    const CADENZE=['sempre','mai','1su2','2su3','3su4','custom'];
    async function renderAccordi(box){
      const risorse=(await supabaseClient.from('turni_risorse').select('id,nome,cognome').eq('attivo',true).order('ordine',{nullsFirst:false}).order('cognome',{nullsFirst:true}).order('nome')).data||[];
      box.innerHTML='<h2 class="text-lg font-bold mb-2">Accordi personali</h2>'+
        '<div class="mb-3"><label class="text-sm">Risorsa <select id="ris" class="border rounded px-2 py-1 text-sm"></select></label></div><div id="grid"></div>';
      const sel=box.querySelector('#ris');
      sel.innerHTML=risorse.map(r=>`<option value="${r.id}">${esc((r.cognome||'')+' '+r.nome)}</option>`).join('');
      sel.onchange=()=>renderGrid(box, Number(sel.value));
      if(risorse.length) renderGrid(box, risorse[0].id); else box.querySelector('#grid').innerHTML='<p class="text-gray-400 text-sm">Nessuna risorsa attiva.</p>';
    }
    async function renderGrid(box, risorsaId){
      const { data } = await supabaseClient.from('turni_accordi').select('*').eq('risorsa_id',risorsaId);
      const byG={}; (data||[]).forEach(a=>byG[a.giorno]=a);
      const grid=box.querySelector('#grid');
      const tbl=document.createElement('table'); tbl.className='w-full text-sm bg-white rounded shadow max-w-xl';
      tbl.innerHTML='<thead><tr class="text-left border-b text-gray-500"><th class="p-2">Giorno</th><th class="p-2">Cadenza lavoro</th><th class="p-2">Preferito riposo</th></tr></thead>';
      const tb=document.createElement('tbody');
      for(let g=1; g<=7; g++){
        const a=byG[g]||{cadenza:'sempre', pref_riposo:false};
        const tr=document.createElement('tr'); tr.className='border-b';
        const seln=document.createElement('select'); seln.className='border rounded px-1 text-sm';
        CADENZE.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; if(a.cadenza===c)o.selected=true; seln.appendChild(o); });
        const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!a.pref_riposo;
        const salva=async()=>{ const {error}=await supabaseClient.from('turni_accordi').upsert({risorsa_id:risorsaId, giorno:g, cadenza:seln.value, pref_riposo:cb.checked},{onConflict:'risorsa_id,giorno'}); if(error)alert(error.message); };
        seln.onchange=salva; cb.onchange=salva;
        const td0=document.createElement('td'); td0.className='p-2 font-medium'; td0.textContent=GIORNI[g];
        const td1=document.createElement('td'); td1.className='p-2'; td1.appendChild(seln);
        const td2=document.createElement('td'); td2.className='p-2'; td2.appendChild(cb);
        tr.append(td0,td1,td2); tb.appendChild(tr);
      }
      tbl.appendChild(tb); grid.innerHTML=''; grid.appendChild(tbl);
    }

    // ---------- Regole ----------
    async function renderRegole(box){
      const { data } = await supabaseClient.from('turni_regole').select('*').eq('id',1).maybeSingle();
      const r=data||{};
      box.innerHTML=`<h2 class="text-lg font-bold mb-3">Regole generali</h2>
        <div class="space-y-3 text-sm max-w-md bg-white p-4 rounded shadow">
          <label class="block">Riposo settimanale minimo (giorni)<input id="rmin" type="number" class="w-full border rounded px-2 py-1" value="${r.riposo_sett_min==null?1:r.riposo_sett_min}"></label>
          <label class="flex items-center gap-2"><input id="bil" type="checkbox" ${r.bilancia_straordinari?'checked':''}> Bilancia gli straordinari tra le risorse</label>
          <label class="block">Tolleranza ore (± ore/sett)<input id="toll" type="number" step="0.5" class="w-full border rounded px-2 py-1" value="${r.tolleranza_ore==null?2:r.tolleranza_ore}"></label>
          <label class="block">Max giorni consecutivi (vuoto = nessun limite)<input id="maxc" type="number" class="w-full border rounded px-2 py-1" value="${r.max_giorni_consecutivi==null?'':r.max_giorni_consecutivi}"></label>
          <label class="block">Giorno prioritario di copertura
            <select id="gp" class="w-full border rounded px-2 py-1"><option value="">Nessuno (Lun→Dom)</option>${[1,2,3,4,5,6,7].map(g=>`<option value="${g}" ${r.giorno_prioritario===g?'selected':''}>${GIORNI[g]}</option>`).join('')}</select>
            <span class="block text-xs text-gray-500 mt-1">Il generatore copre prima questo giorno ogni settimana, così il riposo ruota sugli altri giorni (utile per non lasciare sempre le stesse persone a riposo la domenica).</span></label>
          <div class="text-right"><button id="sav" class="px-3 py-1.5 bg-blue-600 text-white rounded text-sm">Salva</button></div>
        </div>`;
      box.querySelector('#sav').onclick=async()=>{
        const payload={ id:1, riposo_sett_min:Number(box.querySelector('#rmin').value||1), bilancia_straordinari:box.querySelector('#bil').checked,
          tolleranza_ore:Number(box.querySelector('#toll').value||0), max_giorni_consecutivi: box.querySelector('#maxc').value?Number(box.querySelector('#maxc').value):null,
          giorno_prioritario: box.querySelector('#gp').value?Number(box.querySelector('#gp').value):null };
        const { error } = await supabaseClient.from('turni_regole').upsert(payload,{onConflict:'id'});
        if(error){ alert(error.message); return; } alert('Regole salvate.');
      };
    }

    // ---------- Assenze ----------
    async function renderAssenze(box){
      const risorse=(await supabaseClient.from('turni_risorse').select('id,nome,cognome').order('ordine',{nullsFirst:false}).order('cognome',{nullsFirst:true}).order('nome')).data||[];
      const nomeR={}; risorse.forEach(r=>nomeR[r.id]=((r.cognome||'')+' '+r.nome).trim());
      renderLista(box, { tabella:'turni_assenze', titolo:'Assenze', ordina:'data_inizio', campi:[
        {k:'risorsa_id', label:'Risorsa', tipo:'select', obbligatorio:true, opts:risorse.map(r=>({v:r.id,l:nomeR[r.id]}))},
        {k:'data_inizio', label:'Dal', tipo:'date', obbligatorio:true},
        {k:'data_fine', label:'Al', tipo:'date', obbligatorio:true},
        {k:'tipo', label:'Tipo', tipo:'select', obbligatorio:true, opts:[{v:'ferie',l:'Ferie'},{v:'malattia',l:'Malattia'},{v:'indisponibilita',l:'Indisponibilità'}]},
        {k:'note', label:'Note', tipo:'text'},
      ]});
    }
  </script>
</body>
</html>
