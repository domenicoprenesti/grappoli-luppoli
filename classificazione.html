<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
    <title>Classificazione - Grappoli & Luppoli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        .sidebar {
            width: 280px;
            min-width: 280px;
            height: calc(100vh - 64px);
            position: sticky;
            top: 64px;
        }
        .main-content {
            flex: 1;
            min-width: 0;
            overflow-x: auto;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <script>(async () => { await requireAuth('classificazione.html', { adminOnly: true }); carica(); })();</script>

<nav class="fixed top-0 left-0 right-0 bg-white shadow-lg z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <button onclick="window.location.href='dashboard.html'" class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-lg overflow-hidden flex-shrink-0">
                            <img src="logo.png" alt="Logo" class="w-full h-full object-cover">
                        </div>
                        <span class="text-lg font-bold">Grappoli &amp; Luppoli</span>
                    </button>
                    <div class="hidden md:ml-10 md:flex md:space-x-4">
                        <a href="dashboard.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">Dashboard</a>
                        <a href="fatture.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">Fatture</a>
                        <a href="prodotti.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">Prodotti</a>
                        <a href="vendite.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">Vendite</a>
                        <a href="margini.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">Margini</a>
                        <a href="ricavi.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">Ricavi</a>
                        <a href="fornitori.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">Fornitori</a>
                        <a href="utenti.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">Utenti</a>
                        <a href="classificazione.html" class="px-3 py-2 rounded-md text-sm font-medium bg-blue-100 text-blue-700">Classificazione</a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <span id="userName" class="text-sm text-gray-600"></span>
                    <button onclick="logout()" class="px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200">Esci</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex pt-16">
        <aside class="sidebar bg-gradient-to-b from-gray-600 via-gray-700 to-gray-800 text-white p-4 overflow-y-auto">
            <div class="mb-6">
                <h1 class="text-xl font-bold flex items-center">🗂️ Classificazione</h1>
                <p class="text-gray-300 text-xs mt-1">Gerarchia prodotti (Admin)</p>
            </div>
        </aside>

        <main class="main-content p-6">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-2xl font-bold">Gerarchia prodotti</h2>
              <div class="flex gap-2">
                <input id="search" oninput="render()" placeholder="Cerca tipo/prodotto…" class="border rounded px-3 py-2 text-sm">
                <button onclick="carica()" class="px-3 py-2 bg-blue-600 text-white rounded text-sm">↻ Aggiorna</button>
              </div>
            </div>
            <div id="inbox" class="mb-4"></div>
            <div id="tree" class="space-y-2"></div>
        </main>
    </div>

    <script>
        let TREE = [];
        const eur = n => (Number(n)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});

        async function carica(){
          const { data, error } = await supabaseClient.rpc('get_classificazione_tree');
          if (error){ console.error(error); alert('Errore caricamento: '+error.message); return; }
          TREE = data || [];
          render();
        }

        function render(){
          const q = (document.getElementById('search').value||'').toLowerCase();
          renderInbox();
          const root = document.getElementById('tree');
          root.innerHTML = '';
          TREE.forEach(m => {
            const box = document.createElement('div');
            box.className = 'bg-white rounded-lg shadow p-3';
            box.innerHTML = `<div class="flex justify-between items-center">
              <h3 class="font-bold">${m.is_merce?'🟢':'•'} ${m.nome}</h3>
              <span class="text-xs text-gray-500">${m.n_prod} prod · ${eur(m.spesa)}</span></div>`;
            const body = document.createElement('div');
            body.className = 'mt-2 pl-3 space-y-1';
            if (m.is_merce) (m.famiglie||[]).forEach(f => body.appendChild(renderFamiglia(f, q)));
            else (m.voci||[]).forEach(v => { const el=renderVoce(v,q); if(el) body.appendChild(el); });
            box.appendChild(body);
            root.appendChild(box);
          });
        }

        function renderVoce(v, q){
          if (q && !v.nome.toLowerCase().includes(q)) return null;
          const d = document.createElement('div');
          d.className = 'flex justify-between items-center text-sm py-0.5 '+(v.attivo?'':'opacity-40 line-through');
          const left = document.createElement('span'); left.textContent = v.nome;
          const right = document.createElement('span'); right.className='text-gray-400 ml-2 shrink-0';
          right.textContent = `${v.n_prod} · ${eur(v.spesa)}`;
          d.appendChild(left); d.appendChild(right);
          if (isAdmin()){
            const act = document.createElement('span'); act.className='ml-2 space-x-1 shrink-0';
            const mk = (label,title,fn)=>{ const b=document.createElement('button'); b.textContent=label; b.title=title; b.onclick=fn; b.className='hover:opacity-70'; return b; };
            act.appendChild(mk('✏️','Rinomina',()=>azRinomina(v.id, v.nome)));
            act.appendChild(mk('↔️','Sposta',()=>azSposta(v.id)));
            act.appendChild(mk('🔀','Unisci in…',()=>azUnisci(v.id)));
            act.appendChild(mk('🗑️','Elimina',()=>azElimina(v.id)));
            d.appendChild(act);
          }
          return d;
        }

        function renderFamiglia(f, q){
          const wrap = document.createElement('div');
          const h = document.createElement('div'); h.className='font-semibold text-sm text-gray-700'; h.textContent=f.nome;
          wrap.appendChild(h);
          const ul = document.createElement('div'); ul.className='pl-3';
          (f.tipi||[]).forEach(t => { const el=renderVoce(t,q); if(el) ul.appendChild(el); });
          wrap.appendChild(ul);
          return wrap;
        }

        function renderInbox(){
          const daSmistare = TREE.find(m=>m.id===9);
          const vuoti = [];
          TREE.forEach(m=>{
            const raccogli = t => { if((t.n_prod||0)===0 && t.attivo) vuoti.push(t.nome); };
            if(m.is_merce) (m.famiglie||[]).forEach(f=>(f.tipi||[]).forEach(raccogli));
            else (m.voci||[]).forEach(raccogli);
          });
          const el = document.getElementById('inbox');
          el.innerHTML =
            `<div class="bg-amber-50 border border-amber-200 rounded p-3 text-sm">`+
            `❓ <b>Da smistare</b>: ${daSmistare? (daSmistare.n_prod+' prodotti · '+eur(daSmistare.spesa)) : '—'} `+
            `<span class="text-gray-500">(Consumabili/Miscellaneo → verranno spacchettati in Fase 2)</span></div>`+
            `<div class="bg-gray-50 border rounded p-3 text-sm mt-2">🫙 <b>Tipi vuoti</b> (${vuoti.length}): ${vuoti.join(', ')||'nessuno'}</div>`;
        }

        function elencoMacro(){ return TREE.map(m=>`${m.id}=${m.nome}`).join('\n'); }

        async function azRinomina(id, nome){
          const nuovo = prompt('Nuovo nome del tipo:', nome); if(!nuovo || nuovo===nome) return;
          const { error } = await supabaseClient.rpc('rinomina_tipo', {p_tipo:id, p_nome:nuovo});
          if(error) return alert(error.message); carica();
        }
        async function azSposta(id){
          const macro = parseInt(prompt('Sposta sotto quale Macro?\n'+elencoMacro())); if(!macro) return;
          let fam = null;
          const m = TREE.find(x=>x.id===macro);
          if (m && m.is_merce){
            const fams=(m.famiglie||[]).map(f=>`${f.id}=${f.nome}`).join('\n');
            fam = parseInt(prompt('In quale Famiglia?\n'+fams)) || null;
          }
          const { error } = await supabaseClient.rpc('sposta_tipo', {p_tipo:id, p_macro:macro, p_famiglia:fam});
          if(error) return alert(error.message); carica();
        }
        async function azUnisci(id){
          const dest = parseInt(prompt('Unisci questo tipo DENTRO quale tipo? (id destinazione)')); if(!dest) return;
          if(!confirm('I prodotti e le righe verranno spostati e questo tipo disattivato. Procedere?')) return;
          const { error } = await supabaseClient.rpc('unisci_tipo', {p_da:id, p_a:dest});
          if(error) return alert(error.message); carica();
        }
        async function azElimina(id){
          if(!confirm('Disattivare questo tipo? (consentito solo se vuoto)')) return;
          const { error } = await supabaseClient.rpc('elimina_tipo', {p_tipo:id});
          if(error) return alert(error.message); carica();
        }
    </script>
</body>
</html>
